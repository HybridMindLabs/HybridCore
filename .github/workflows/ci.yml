name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php:
    name: PHP — Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hybridcore_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Security audit (Composer)
        run: composer audit

      # Baselined at adoption: existing findings are frozen, new code is
      # analysed at level 5. Shrink phpstan-baseline.neon over time.
      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      # Covers tests/ and whichever bundled extensions are in this repo — most
      # live in their own repositories and are absent here, so CI runs fewer
      # tests than a developer with them checked out.
      #
      # The threshold is a deliberately loose floor: 63.4% was measured locally
      # *with* those extra suites present, so it is not CI's number. Raise this
      # once a run reports the real figure.
      #
      # Coverage is measured serially: per-worker line data would have to be
      # merged, and the suite is fast enough that it is not worth it.
      - name: Run tests
        run: php artisan test --coverage --min=50

      # Parallel workers each get an isolated storage dir (see Tests\TestCase),
      # so this also guards against cross-process state leaking back in.
      - name: Run tests in parallel
        run: php artisan test --parallel

  frontend:
    name: Frontend — TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --audit-level=high

      # Fails on errors only; unused-variable findings stay warnings for now.
      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

      - name: Build
        run: npm run build

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hybridcore_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hybridcore_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      ADMIN_EMAIL: admin@hybridcore.test
      ADMIN_PASSWORD: password
      # A real run signs in far more than 5 times a minute from one address.
      LOGIN_RATE_LIMIT: 100

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=E2ESeeder --force
          php artisan hybridcore:install-lock

      # The specs drive a real browser, so the assets have to be built first.
      - name: Build assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Serve application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not start in time" >&2
          exit 1

      - name: Run E2E tests
        run: npx playwright test --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
