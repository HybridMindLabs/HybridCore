name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php:
    name: PHP — Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hybridcore_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Security audit (Composer)
        run: composer audit

      # Baselined at adoption: existing findings are frozen, new code is
      # analysed at level 5. Shrink phpstan-baseline.neon over time.
      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      # Covers tests/ and whichever bundled extensions are in this repo — most
      # live in their own repositories and are absent here, so CI runs fewer
      # tests than a developer with them checked out.
      #
      # Real CI figure (run #31035223160, 2026-08-05): 67.7%. Floored at 60 —
      # a few points of margin so one borderline PR doesn't redden the build,
      # while still catching an actual coverage regression.
      #
      # Coverage is measured serially: per-worker line data would have to be
      # merged, and the suite is fast enough that it is not worth it.
      - name: Run tests
        run: php artisan test --coverage --min=60

      # Parallel workers each get an isolated storage dir (see Tests\TestCase),
      # so this also guards against cross-process state leaking back in.
      - name: Run tests in parallel
        run: php artisan test --parallel

  frontend:
    name: Frontend — TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --audit-level=high

      # Fails on errors only; unused-variable findings stay warnings for now.
      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

      - name: Build
        run: npm run build

  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    needs: [php, frontend]
    # Only main, only a real push (never a PR), and never the bot's own
    # release commit — that last check is belt-and-braces: "[skip ci]" in the
    # commit message already stops GitHub from starting any workflow run for
    # it, but without this guard too a future workflow edit that drops that
    # tag would start silently double-releasing on every run.
    if: >
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && !contains(github.event.head_commit.message, 'chore: release')
    outputs:
      bump: ${{ steps.compute.outputs.bump }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional-commit prefixes drive the bump: any "type!:" or a
      # "BREAKING CHANGE" footer forces major, "feat:" forces minor.
      # Everything else bumps patch, UNLESS every commit since the last tag
      # is chore/docs/style/test/ci/build only — then there's nothing worth
      # releasing and the job is skipped entirely.
      - name: Compute semver bump from commit history
        id: compute
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="$LAST_TAG..HEAD"

          SUBJECTS=$(git log "$RANGE" --pretty=format:"%s")
          BODY=$(git log "$RANGE" --pretty=format:"%B")

          if [ -z "$SUBJECTS" ]; then
            BUMP="none"
          elif echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$BODY" | grep -q "BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          elif echo "$SUBJECTS" | grep -vqE '^(chore|docs|style|test|ci|build)(\([^)]*\))?:'; then
            BUMP="patch"
          else
            BUMP="none"
          fi

          echo "Commits since ${LAST_TAG:-repo start}: bump=$BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [php, frontend, determine-version]
    if: needs.determine-version.outputs.bump != 'none'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      # package.json is the one source of truth for the version number;
      # UpdateController::VERSION is kept in sync with a substitution rather
      # than a second manually-maintained value.
      - name: Bump version
        id: bump
        run: |
          npm version "${{ needs.determine-version.outputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/VERSION = '[^']*';/VERSION = '${VERSION}';/" app/Http/Controllers/Admin/UpdateController.php

      # Groups commits since the last tag into Keep a Changelog sections by
      # their conventional-commit prefix and inserts them above the previous
      # top entry — same format the file already uses, just filled in.
      - name: Update changelog
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="$LAST_TAG..HEAD"

          added=$(git log "$RANGE" --pretty=format:"%s" | grep -E '^feat(\([^)]*\))?!?:' | sed -E 's/^feat(\([^)]*\))?!?: ?/- /')
          fixed=$(git log "$RANGE" --pretty=format:"%s" | grep -E '^fix(\([^)]*\))?!?:' | sed -E 's/^fix(\([^)]*\))?!?: ?/- /')
          changed=$(git log "$RANGE" --pretty=format:"%s" | grep -vE '^(feat|fix|chore|docs|style|test|ci|build)(\([^)]*\))?!?:' | sed 's/^/- /')

          {
            echo "## [${VERSION}] — $(date +%Y-%m-%d)"
            echo
            if [ -n "$added" ]; then echo "### Added"; echo; echo "$added"; echo; fi
            if [ -n "$fixed" ]; then echo "### Fixed"; echo; echo "$fixed"; echo; fi
            if [ -n "$changed" ]; then echo "### Changed"; echo; echo "$changed"; echo; fi
            echo "---"
            echo
          } > /tmp/changelog_entry.md

          awk -v entryfile=/tmp/changelog_entry.md '
            !inserted && /^## \[/ { while ((getline line < entryfile) > 0) print line; inserted=1 }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/Http/Controllers/Admin/UpdateController.php CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Build release archive
        run: php artisan hybridcore:release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true
          files: storage/app/releases/hybridcore-*.zip
